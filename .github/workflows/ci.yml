name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          check-latest: true
      - name: Run bounded unit tests
        run: python -m unittest discover -s tests -v
      - name: Build portable zipapp
        run: python build.py
      - name: Check portable zipapp entry point
        run: python dist/easy-pc-cleaner.pyz --version

  bundle-windows:
    name: Build Windows portable bundle
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          check-latest: true
      - name: Build portable zipapp
        run: python build.py
      - name: Check portable zipapp entry point
        run: python dist/easy-pc-cleaner.pyz --version
      - name: Install pinned Windows bundle builder
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-build.txt
      - name: Build scoped Windows bundle
        run: python scripts/build_windows.py
      - name: Upload manually-reviewed release inputs
        uses: actions/upload-artifact@v6
        with:
          name: easy-pc-cleaner-release
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/easy-pc-cleaner.pyz
            dist/easy-pc-cleaner-windows-x64.zip
            dist/SHA256SUMS
